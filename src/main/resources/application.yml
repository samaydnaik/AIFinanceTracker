spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/finance_db?useSSL=false&serverTimezone=UTC
    username: root
    password: secret
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    user:
      name: admin
      password: admin  # Temp for dev
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.1:8b   # main chat model
      embeddings:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768   # match your embedding model
        max-document-batch-size: 10000

  datasource-vector:
    url: jdbc:postgresql://localhost:5432/vector_store
    username: postgres
    password: postgres

vaadin:
  launch-browser: false
  block-devmode-startup: true